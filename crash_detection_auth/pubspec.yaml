name: crash_detection
description: A production-ready Flutter app with Firebase Authentication (Google Sign-In, Phone OTP), JWT token management, and Spring Boot backend integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.0

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Secure Storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # HTTP Client with interceptors (token refresh)
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # UI helpers
  fluttertoast: ^8.2.8
  country_code_picker: ^3.0.0
  pinput: ^5.0.0        # OTP input field
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  logger: ^2.4.0

  # Sensor & Location
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  flutter_background_service: ^5.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
